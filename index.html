    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const fMotion = window.Motion || window.FramerMotion;
      const motion =
        fMotion && fMotion.motion
          ? fMotion.motion
          : new Proxy(
              {},
              {
                get: (target, prop) => {
                  return (props) => <div {...props} />;
                },
              },
            );
      const AnimatePresence =
        (fMotion && fMotion.AnimatePresence) || (({ children }) => children);

      // Custom Icon Component compatible with browser-loaded Lucide
      const Icon = ({ name, className = "w-6 h-6", ...props }) => {
        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [name]);
        return (
          <span
            key={name}
            className="inline-flex items-center justify-center shrink-0"
          >
            <i
              data-lucide={name.toLowerCase()}
              className={className}
              {...props}
            ></i>
          </span>
        );
      };

      const ThemeToggle = () => {
        const [isDark, setIsDark] = useState(() => {
          if (typeof window !== "undefined") {
            const saved = localStorage.getItem("theme");
            if (saved) return saved === "dark";
            return document.documentElement.classList.contains("dark");
          }
          return false;
        });

        useEffect(() => {
          const root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            localStorage.setItem("theme", "dark");
          } else {
            root.classList.remove("dark");
            localStorage.setItem("theme", "light");
          }
        }, [isDark]);

        return (
          <div
            onClick={() => setIsDark(!isDark)}
            className="relative w-16 h-8 rounded-full p-1 transition-all duration-500 cursor-pointer overflow-hidden shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)] flex items-center bg-sky-400 dark:bg-slate-900 border border-sky-300 dark:border-slate-700 group ring-offset-2 focus:ring-2 focus:ring-accent outline-none"
            title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
          >
            {/* Stars for Dark Mode */}
            <div
              className={`absolute inset-0 transition-opacity duration-700 ${isDark ? "opacity-100" : "opacity-0"}`}
            >
              <div className="absolute top-1 left-3 w-0.5 h-0.5 bg-white rounded-full animate-pulse"></div>
              <div className="absolute top-4 left-6 w-1 h-1 bg-white rounded-full animate-pulse delay-75"></div>
              <div className="absolute top-2 right-4 w-0.5 h-0.5 bg-white rounded-full animate-pulse delay-150"></div>
              <div className="absolute top-5 right-6 w-0.5 h-0.5 bg-white rounded-full animate-pulse delay-300"></div>
            </div>

            {/* Clouds for Light Mode */}
            <div
              className={`absolute inset-0 transition-opacity duration-700 ${isDark ? "opacity-0" : "opacity-100"}`}
            >
              <div className="absolute top-4 left-5 w-4 h-2 bg-white/60 rounded-full animate-bounce duration-[3000ms]"></div>
              <div className="absolute top-2 right-4 w-5 h-2 bg-white/40 rounded-full animate-bounce duration-[4000ms]"></div>
            </div>

            {/* Handle (Sun/Moon) */}
            <motion.div
              animate={{ x: isDark ? 32 : 0 }}
              transition={{ type: "spring", stiffness: 300, damping: 20 }}
              className={`relative w-6 h-6 rounded-full shadow-lg flex items-center justify-center ${isDark ? "bg-slate-200" : "bg-yellow-400"}`}
            >
              {isDark ? (
                <div className="w-4 h-4 rounded-full bg-slate-300 relative overflow-hidden">
                  <div className="absolute top-1 left-1 w-1.5 h-1.5 bg-slate-400/40 rounded-full"></div>
                  <div className="absolute bottom-1 right-1.5 w-1 h-1 bg-slate-400/40 rounded-full"></div>
                </div>
              ) : (
                <div className="w-5 h-5 rounded-full bg-yellow-300 blur-[0.5px]"></div>
              )}
            </motion.div>
          </div>
        );
      };

      const HeaderInfo = ({ className = "justify-center", isHome = false }) => {
        const [time, setTime] = useState(new Date());
        const [weather, setWeather] = useState(null);

        useEffect(() => {
          const timer = setInterval(() => {
            setTime(new Date());
          }, 1000);
          return () => clearInterval(timer);
        }, []);

        useEffect(() => {
          const fetchWeather = async () => {
            try {
              const res = await fetch(
                "https://api.open-meteo.com/v1/forecast?latitude=21.0221&longitude=105.8019&current=temperature_2m,weather_code",
              );
              const data = await res.json();
              setWeather({
                temp: Math.round(data.current.temperature_2m),
                code: data.current.weather_code,
              });
            } catch (error) {
              console.error("Failed to fetch weather:", error);
            }
          };
          fetchWeather();
          const weatherTimer = setInterval(fetchWeather, 600000);
          return () => clearInterval(weatherTimer);
        }, []);

        const formatTime = (date) => {
          return date.toLocaleTimeString("en-US", {
            hour12: false,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZone: "Asia/Ho_Chi_Minh",
          });
        };

        const getWeatherIcon = (code) => {
          if (code === 0) return "☀️";
          if (code <= 3) return "⛅";
          if (code <= 48) return "🌫️";
          if (code <= 67) return "🌧️";
          if (code <= 77) return "❄️";
          if (code <= 82) return "🌧️";
          if (code <= 99) return "⛈️";
          return "⛅";
        };

        const textColor = isHome
          ? "text-white/80"
          : "text-primary dark:text-gray-300";

        return (
          <div
            className={`flex items-center space-x-6 ${textColor} text-xs md:text-base font-black uppercase tracking-[0.2em] mb-4 animate-fade-in relative z-20 ${className}`}

            <div className="flex items-center">
              <Icon name="Clock" className="w-4 h-4 mr-2 text-accent" />
              <span>Hanoi: {formatTime(time)}</span>
            </div>
            <div className="flex items-center">
              <Icon name="Cloud-Sun" className="w-4 h-4 mr-2 text-accent" />
              <span>
                {weather
                  ? `${getWeatherIcon(weather.code)} ${weather.temp}°C`
                  : "Chùa Láng..."}
              </span>
              <span className="ml-2 text-[10px] opacity-60">
                Dong Da, Ha Noi
              </span>
            </div>
          </div>
        );
      };

          {

          {
            genre: "Soft skills",
            title: "Sách Homo Deus - Lược sử tương lai",
            contributor: "Eliter",
            link: "https://drive.google.com/file/d/1Gyr0eZ97cD8-MycvAKyeDSq5NBiA_-xg/view",
          },
          {
            genre: "Soft skills",
            title: "Sapiens - Lược sử về loài người",
            contributor: "Eliter",
            link: "https://drive.google.com/file/d/1sZS-pyx9pVz3mg-edlz2LsGtbVuEZX7e/view",
          }
        ];

        const DevelopmentPage = ({ setActivePage }) => {
          const [activeCategory, setActiveCategory] = React.useState("All");
          const [searchQuery, setSearchQuery] = React.useState("");
          const [columns, setColumns] = React.useState(3);

          const categories = [
            "All",
            "Commercial",
            "Administration",
            "Operation",
            "Career Essens",
            "MT",
            "Soft skills",
          ];

          const documents = DEVELOPMENT_BOOKS;
        
        const getDriveId = (url) => {
          if (!url) return null;
          const match = url.match(/(?:id=|\/d\/|\/folders\/)([^&?\/]+)/);
          return match ? match[1] : null;
        };

        const getThumbnailUrl = (url) => {
          const id = getDriveId(url);
          if (!id || url.includes("/folders/"))
            return "https://images.unsplash.com/photo-1544377193-33dcf4d68fb5?auto=format&fit=crop&q=80&w=400";
          return `https://drive.google.com/thumbnail?id=${id}&sz=w400`;
        };

        const getGenreTagStyle = (genre) => {
          if (!genre) return "bg-primary/95 text-white";
          const g = genre.toLowerCase();
          if (g.includes("commercial")) {
            return "bg-blue-600 dark:bg-blue-500 text-white";
          }
          if (g.includes("administration")) {
            return "bg-purple-600 dark:bg-purple-500 text-white";
          }
          if (g.includes("operation")) {
            return "bg-emerald-600 dark:bg-emerald-500 text-white";
          }
          if (g.includes("soft skills")) {
            return "bg-indigo-600 dark:bg-indigo-500 text-white";
          }
          if (g.includes("career")) {
            return "bg-amber-600 dark:bg-amber-500 text-white";
          }
          if (g.includes("mt")) {
            return "bg-rose-600 dark:bg-rose-500 text-white";
          }
          return "bg-primary/95 text-white";
        };

        const filteredDocuments = documents.filter((doc) => {
          const matchesCategory =
            activeCategory === "All" ||
            (() => {
              if (activeCategory === "Commercial") return doc.genre.includes("Commercial");
              if (activeCategory === "MT") return doc.genre.includes("MT");
              return doc.genre.includes(activeCategory);
            })();
          const matchesSearch =
            doc.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (doc.contributor || "")
              .toLowerCase()
              .includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        return (
          <div className="bg-warm-white dark:bg-transparent min-h-screen font-sans antialiased text-charcoal dark:text-gray-200 pb-24 transition-colors duration-300">
            <div className="absolute top-24 left-0 w-full h-[350px] bg-gradient-to-b from-accent/5 to-transparent pointer-events-none -z-10" />

            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12">

                  Tài liệu học tập, phát triển kỹ năng mềm, kiến thức thực tế dành cho các Eliters.

                  {categories.map((category) => (
                    <button
                      key={category}
                      onClick={() => setActiveCategory(category)}
                      className={`px-5 py-2.5 rounded-full font-bold text-sm tracking-wide transition-all duration-300 border shrink-0 whitespace-nowrap ${
                        activeCategory === category
                          ? "bg-accent border-accent text-white shadow-lg shadow-accent/20"
                          : "bg-white dark:bg-slate-800 border-gray-100 dark:border-white/5 text-primary dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700"
                      }`}
                    >
                      {category}
                    </button>
                  ))}
                </div>

                {/* Search box */}
                <div className="relative w-full md:w-80">
                  <input

                    placeholder="Tìm kiếm tài liệu hoặc người đóng góp..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}

                  />
                  <div className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                    <Icon name="Search" className="w-5 h-5" />
                  </div>
                </div>
              </div>

              {/* Sleek Minimal Range Slider */}
              <div className="flex justify-end items-center gap-3 mb-8">
                <span className="text-xs font-bold text-gray-400 select-none uppercase tracking-wider">Cột hiển thị:</span>
                <input
                  type="range"
                  min="2"
                  max="5"
                  step="1"
                  value={columns}
                  onChange={(e) => setColumns(Number(e.target.value))}
                  className="w-24 sm:w-32 h-1.5 bg-gray-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-accent transition-all duration-300"
                />
                <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-accent/10 border border-accent/20 text-accent font-black text-sm">
                  {columns}
                </span>
              </div>

              {/* Documents Grid */}
              {filteredDocuments.length > 0 ? (
                <div className={`grid grid-cols-1 ${columns >= 4 ? 'gap-5 md:gap-6' : 'gap-10'} ${
                  columns === 2 ? "md:grid-cols-2" :
                  columns === 3 ? "md:grid-cols-3" :
                  columns === 4 ? "md:grid-cols-4" :
                  columns === 5 ? "md:grid-cols-5" : "md:grid-cols-3"
                }`}>
                  {filteredDocuments.map((doc, idx) => (
                    <motion.div
                      key={idx}
                      initial={{ opacity: 0, y: 15 }}
                      animate={{ opacity: 1, y: 0 }}
                      transition={{ duration: 0.5 }}
                      className={`group bg-white dark:bg-slate-800 rounded-[32px] md:rounded-[40px] flex flex-col justify-between hover:shadow-2xl hover:translate-y-[-8px] transition-all duration-500 border border-gray-100/50 dark:border-white/5 ${columns >= 4 ? 'p-5' : 'p-8'}`}
                    >
                      <div>
                        {/* Book cover visual */}
                        <div className={`relative aspect-[4/3] w-full rounded-2xl bg-gray-50 dark:bg-slate-900 overflow-hidden border border-gray-100 dark:border-white/5 shadow-inner ${columns >= 4 ? 'mb-5' : 'mb-8'}`}>
                          <img
                            src={getThumbnailUrl(doc.link)}
                            alt={doc.title}
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src =
                                "https://images.unsplash.com/photo-1544377193-33dcf4d68fb5?auto=format&fit=crop&q=80&w=400";
                            }}
                            className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                          />
                          <div className="absolute top-4 left-4">
                            <span className={`backdrop-blur-md rounded-full text-[10px] font-black uppercase tracking-widest shadow-md ${getGenreTagStyle(doc.genre)} ${columns >= 4 ? 'px-3 py-1' : 'px-4 py-1.5'}`}>
                              {doc.genre}
                            </span>
                          </div>
                        </div>

                        {/* Title */}
                        <h3 className={`font-black text-primary dark:text-white leading-tight mb-4 group-hover:text-accent transition-colors line-clamp-2 ${columns >= 4 ? 'text-base' : 'text-xl md:text-2xl'}`}>
                          {doc.title}
                        </h3>

                        {/* Contributor details */}
                        <div className={`flex flex-col text-gray-500 dark:text-gray-400 font-bold ${columns >= 4 ? 'gap-1.5 mb-5' : 'gap-2 mb-8'}`}>
                          <span className="text-xs uppercase tracking-wider text-primary/80 dark:text-gray-300 flex items-center gap-2">
                            <Icon name="User" className="w-4 h-4 text-accent" />{" "}
                            Người đóng góp: {doc.contributor || "Eliter"}
                          </span>
                        </div>
                      </div>

                      <a
                        href={doc.link}
                        target="_blank"
                        rel="noopener noreferrer"
                        className={`flex items-center justify-center bg-primary dark:bg-accent hover:bg-accent dark:hover:bg-accent/80 text-white font-black transition-all shadow-xl active:scale-95 group/btn border border-transparent dark:border-white/10 ${columns >= 4 ? 'gap-2 w-full py-3.5 rounded-[16px] text-sm' : 'gap-4 w-full py-5 rounded-[24px] text-lg'}`}
                      >
                        <span>XEM CHI TIẾT</span>
                        <Icon
                          name="External-Link"
                          className={`${columns >= 4 ? 'w-4 h-4' : 'w-5 h-5'} group-hover/btn:translate-x-1 transition-transform`}
                        />
                      </a>
                    </motion.div>
                  ))}
                </div>
              ) : (
                <div className="py-20 text-center text-gray-400 dark:text-gray-500 border border-dashed border-gray-250 dark:border-white/10 rounded-[40px]">
                  <p className="text-xl font-bold uppercase tracking-widest">
                    Không có tài liệu phù hợp
                  </p>
                </div>
              )}
            </main>
          </div>
        );
      };

      // MAIN APP ROUTER (State-Based)
      const App = () => {
        const [activePage, setActivePage] = useState("home");
        const [toast, setToast] = useState(null);

        const triggerToast = (msg) => {
          setToast(msg);
          setTimeout(() => {
            setToast((current) => (current === msg ? null : current));
          }, 4000);
        };

        useEffect(() => {
          window.scrollTo(0, 0);
        }, [activePage]);

        const renderContent = () => {
          if (activePage.startsWith("elearning-detail-")) {
            const id = activePage.replace("elearning-detail-", "");
            return <CourseDetailPage id={id} setActivePage={setActivePage} />;
          }
          switch (activePage) {
            case "home":
              return <HomePage setActivePage={setActivePage} />;
            case "elibrary":
            case "elibrary-studyspace":
              return (
                <ELibraryPage
                  setActivePage={setActivePage}
                  activePage={activePage}
                />
              );
            case "share-library":
              return <ShareLibraryPage setActivePage={setActivePage} />;
            case "development":
              return <DevelopmentPage setActivePage={setActivePage} />;
            case "elearning":
              return <ELearningPage setActivePage={setActivePage} />;
            case "emagazine":
              return <EMagazinePage />;
            case "guide":
              return <GuidePage />;
            case "about":
              return <AboutPage />;
            default:
              return <HomePage setActivePage={setActivePage} />;
          }
        };

        return (
          <div className="flex flex-col min-h-screen dark:bg-transparent">
            <Navbar
              activePage={activePage}
              setActivePage={setActivePage}
              triggerToast={triggerToast}
            />
            <main className="flex-grow">{renderContent()}</main>
            <Footer />

            {/* Elite Toast Notification */}
            <AnimatePresence>
              {toast && (
                <motion.div
                  initial={{ opacity: 0, y: 50, scale: 0.9 }}
                  animate={{ opacity: 1, y: 0, scale: 1 }}
                  exit={{ opacity: 0, y: 20, scale: 0.9 }}
                  className="fixed bottom-8 right-8 z-[200] max-w-md bg-slate-900/95 dark:bg-slate-950/95 backdrop-blur-xl border border-accent/25 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-4 text-white"
                >
                  <div className="w-10 h-10 bg-accent/20 rounded-2xl flex items-center justify-center text-accent shrink-0">
                    <Icon name="Alert-Circle" className="w-5 h-5" />
                  </div>
                  <div className="flex-1">
                    <p className="text-xs font-black uppercase tracking-widest text-accent mb-0.5">
                      Thông báo hệ thống
                    </p>
                    <p className="text-sm font-bold text-gray-200 leading-snug">
                      {toast}
                    </p>
                  </div>
                  <button
                    onClick={() => setToast(null)}
                    className="text-white/40 hover:text-white p-1"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
